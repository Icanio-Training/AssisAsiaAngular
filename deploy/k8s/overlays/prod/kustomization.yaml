# prod overlay — same image as the other environments, different config. Apply with:
#   kubectl apply -k deploy/k8s/overlays/prod            (preview: kubectl kustomize deploy/k8s/overlays/prod)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: adme-prod                  # one namespace per environment
resources:
  - ../../base
images:
  - name: adme-portal-angular
    newName: myregistry.azurecr.io/adme-portal-angular   # ACR / ECR / Quay / OpenShift registry
    newTag: latest                                      # CI sets the git SHA: kustomize edit set image ...
configMapGenerator:
  - name: adme-portal-config
    files:
      - config.json                    # becomes /usr/share/nginx/html/config.json in the pod
replicas:
  - name: adme-portal
    count: 3
patches:
  - target: { kind: Ingress, name: adme-portal }
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: adme.example.org
      - op: replace
        path: /spec/tls/0/hosts/0
        value: adme.example.org
