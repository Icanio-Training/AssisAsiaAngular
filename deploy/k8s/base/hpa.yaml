# HorizontalPodAutoscaler: add pods when average CPU > 70% of the request, up to maxReplicas.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: adme-portal
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: adme-portal }
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }
