# Included in EVERY location of nginx.conf.
# GOTCHA: an add_header inside a location REPLACES all inherited add_header lines,
# so headers defined only at server level would silently vanish wherever a location
# sets its own Cache-Control. Including this file everywhere avoids that.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;                          # clickjacking (legacy header)
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
# CSP: only our own scripts. 'unsafe-inline' for STYLES is needed because Angular injects
# component <style> tags (use a CSP nonce via ngCspNonce to remove it). frame-ancestors = modern clickjacking defence.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://login.microsoftonline.com; frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;
