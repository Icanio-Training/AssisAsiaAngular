# nginx config for the Angular SPA (listens on 8080 — non-root friendly).
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;                      # don't advertise the nginx version

  # ---- Compression (smaller transfers; brotli needs an extra module, gzip is built in) ----
  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;

  # ---- Security headers: see security-headers.conf (included in every location below) ----

  # ---- Probes for Kubernetes/OpenShift ----
  location = /healthz {
    access_log off;
    add_header Content-Type text/plain;
    return 200 'ok';
  }

  # ---- Caching ----
  # Hashed bundles (main-ABC123.js) never change → cache for a year.
  location ~* \.(?:js|css|woff2?|png|jpe?g|svg|ico)$ {
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
    include /etc/nginx/snippets/security-headers.conf;
    try_files $uri =404;
  }

  # index.html and runtime config must ALWAYS be re-validated, or users keep old builds/settings.
  location = /config.json {
    add_header Cache-Control "no-store";
    include /etc/nginx/snippets/security-headers.conf;
    try_files $uri =404;
  }

  # ---- SPA fallback: unknown paths (/initiatives/activities/12) serve index.html, Angular routes them ----
  location / {
    add_header Cache-Control "no-cache";
    include /etc/nginx/snippets/security-headers.conf;
    try_files $uri $uri/ /index.html;
  }

  # API calls normally go Ingress → backend Service directly. If nginx should proxy them instead:
  # location /api/ { proxy_pass http://adme-api:8000; proxy_set_header Host $host; }
}
